name: Build DynamicNotch for Ventura Intel

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Check Xcode Version
      run: xcodebuild -version

    - name: Resolve Swift Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
                   -project DynamicNotch.xcodeproj \
                   -scheme DynamicNotch \
                   -clonedSourcePackagesDirPath SourcePackages

    - name: Build App for macOS Ventura (Universal)
      run: |
        xcodebuild -project DynamicNotch.xcodeproj \
                   -scheme DynamicNotch \
                   -configuration Release \
                   -arch x86_64 -arch arm64 \
                   -clonedSourcePackagesDirPath SourcePackages \
                   -derivedDataPath build \
                   MACOSX_DEPLOYMENT_TARGET=13.0 \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build

    - name: Zip Built App
      run: |
        APP_PATH=$(find build/Build/Products/Release -name "DynamicNotch.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: DynamicNotch.app not found!"
          exit 1
        fi
        cd "$(dirname "$APP_PATH")"
        zip -r DynamicNotch-macOS-Universal.zip DynamicNotch.app
        mv DynamicNotch-macOS-Universal.zip $GITHUB_WORKSPACE/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DynamicNotch-Ventura-Intel
        path: DynamicNotch-macOS-Universal.zip
